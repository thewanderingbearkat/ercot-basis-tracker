services:
  - type: web
    name: ercot-basis-tracker
    runtime: python
    # Starter (not free): the free plan has an ephemeral filesystem and can't mount a
    # disk, so every deploy wiped the shadow-trader cache, bid ledger and forward-only
    # forecast history.
    plan: starter
    region: oregon

    # Build configuration
    buildCommand: pip install -r requirements.txt
    # IMPORTANT: keep this at --workers 1. Shadow Trader's auto-refresh thread,
    # `_refresh_status` flag, and in-memory cache all live in a single Python
    # process. Running >1 worker means each process has its own refresh thread
    # and they race to write data/raw_cache.json, leaving the dashboard showing
    # inconsistent "Refreshing..." states depending on which worker handled the
    # request. Use --threads to handle concurrent requests instead.
    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT --timeout 120 app:app

    # Environment variables
    envVars:
      # Same Python as the energy-waterfall cron job. On Render's default (3.13) the Snowflake connector's native
      # core segfaulted (exit 139) during the SkyVest login from this web process; 3.12.7 runs it cleanly.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      # Shadow trader cache + bid ledger live on the persistent disk below.
      - key: SHADOW_DATA_DIR
        value: /var/data/shadow
      - key: SECRET_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: TENASKA_API_USER
        sync: false
      - key: TENASKA_API_PASSWORD
        sync: false
      - key: PHAROS_API_TOKEN
        sync: false
      # Hail Monitor (Vaisala XWeather). Set the actual ID/secret in the Render
      # dashboard -- the /hail tab returns an auth error until both are present.
      - key: XWEATHER_CLIENT_ID
        sync: false
      - key: XWEATHER_CLIENT_SECRET
        sync: false
      # Snowflake (Yes Energy) for the Constraint Map. KEY-PAIR ONLY -- we do NOT
      # set SNOWFLAKE_PASSWORD here, so Render never uses password auth and never
      # triggers Snowflake MFA (Duo). Set SNOWFLAKE_PRIVATE_KEY to the full PEM
      # contents of the private key in the Render dashboard.
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY
        sync: false
      # SkyVest Snowflake (GOLD.PERFORMANCE) for the Energy Waterfall tab: service user, key-pair only.
      # Set SKYVEST_SNOWFLAKE_PRIVATE_KEY to the PEM contents of svc_performance_app_rsa_key.p8.
      - key: SKYVEST_SNOWFLAKE_ACCOUNT
        value: A8022540555871-MAIN
      - key: SKYVEST_SNOWFLAKE_USER
        value: SVC_PERFORMANCE_APP
      - key: SKYVEST_SNOWFLAKE_ROLE
        value: PERFORMANCE_APP
      - key: SKYVEST_SNOWFLAKE_WAREHOUSE
        value: GENERAL_WH
      - key: SKYVEST_SNOWFLAKE_PRIVATE_KEY
        sync: false

    # Persistent disk for shadow-trader state (raw cache, bid ledger). Survives deploys.
    disk:
      name: shadow-data
      mountPath: /var/data
      sizeGB: 1

    # Service details
    healthCheckPath: /api/health

    # Auto-deploy on push
    autoDeploy: true

  # Energy Waterfall weekly refresh: rebuilds the trailing 3 weeks for every enabled Bazefield plant (Lakefield,
  # McCrae, Holstein; NW Ohio switches on automatically once it has ~4 weeks of data) into SkyVest Snowflake
  # GOLD.PERFORMANCE. Standard (2 GB) because Lakefield is 137 turbines x 3 weeks of 10-minute SCADA; billed only
  # while it runs (~15-20 min a week). Exit code 1 if any plant fails (the others still load).
  - type: cron
    name: energy-waterfall-refresh
    runtime: python
    plan: standard
    region: oregon
    schedule: "0 12 * * 1"          # Mondays 12:00 UTC (7 am Central)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m energy_waterfall.refresh --days 21
    envVars:
      - key: PYTHON_VERSION          # Blueprint runtime is just "python"; the version is pinned here
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BAZEFIELD_BASE_URL
        sync: false
      - key: BAZEFIELD_API_KEY
        sync: false
      - key: VAISALA_POWERUP_USER_GUID
        sync: false
      - key: VAISALA_POWERUP_USER_SECRET
        sync: false
      # Yes Energy share (MISO 5-minute LMPs for Lakefield's compensation test): same key pair as the web service
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY
        sync: false
      - key: SKYVEST_SNOWFLAKE_ACCOUNT
        value: A8022540555871-MAIN
      - key: SKYVEST_SNOWFLAKE_USER
        value: SVC_PERFORMANCE_APP
      - key: SKYVEST_SNOWFLAKE_ROLE
        value: PERFORMANCE_APP
      - key: SKYVEST_SNOWFLAKE_WAREHOUSE
        value: GENERAL_WH
      - key: SKYVEST_SNOWFLAKE_PRIVATE_KEY
        sync: false
